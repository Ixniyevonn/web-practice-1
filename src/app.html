<!doctype html>
<html lang="ru" data-theme="light" class="no-js">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f3ef" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0a08" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="preload" href="%sveltekit.assets%/fonts/Inter-Latin.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="%sveltekit.assets%/fonts/Inter-Cyrillic.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="%sveltekit.assets%/fonts/JetBrainsMono-Latin.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="%sveltekit.assets%/fonts/JetBrainsMono-Cyrillic.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" as="image" href="%sveltekit.assets%/images/savva-960.webp" type="image/webp" />
		<script>
			(function () {
				var root = document.documentElement;
				root.classList.remove("no-js");
				root.classList.add("js");
				try {
					var saved = localStorage.getItem("sk-theme");
					var theme =
						saved === "light" || saved === "dark"
							? saved
							: window.matchMedia("(prefers-color-scheme: dark)").matches
								? "dark"
								: "light";
					root.dataset.theme = theme;
					root.style.colorScheme = theme;
				} catch (error) {
					root.dataset.theme = "light";
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
